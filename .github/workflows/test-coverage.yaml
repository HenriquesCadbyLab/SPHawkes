# Measures how much of R/ the testthat suite actually exercises.
#
# The report is uploaded as a build artifact named "coverage-report" on every
# run -- download it from the run's summary page to see per-file and per-line
# coverage. No third-party service or token is required.
#
# Worth watching: the error paths and the parallel (nprocs > 1) branches are
# the parts most likely to be untested.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -x
          for attempt in 1 2 3; do
            sudo -E apt-get update -y -o Acquire::Retries=3 && break
            echo "apt-get update failed (attempt $attempt), retrying..."
            sleep 5
          done
          sudo -E apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Measure coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE)
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")
          saveRDS(cov, "coverage.rds")
          pc <- covr::percent_coverage(cov)
          cat(sprintf("\nTotal coverage: %.1f%%\n", pc))
          writeLines(
            sprintf("Total coverage: %.1f%%", pc),
            Sys.getenv("GITHUB_STEP_SUMMARY")
          )
        shell: Rscript {0}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            cobertura.xml
            coverage.rds
          retention-days: 30
