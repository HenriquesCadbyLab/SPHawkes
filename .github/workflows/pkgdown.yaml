# Builds the pkgdown reference site and publishes it to the gh-pages branch.
#
# ONE-TIME SETUP (needs repository admin, so a collaborator cannot do it):
#   Settings -> Pages -> Build and deployment
#     Source: "Deploy from a branch"
#     Branch: gh-pages    Folder: / (root)
# The gh-pages branch is created automatically by the first successful run of
# this workflow, so run the workflow first, then set the option above.
#
# The site then appears at https://henriquescadbylab.github.io/spHawkes/
# (matching the `url:` field in _pkgdown.yml).
#
# Pull requests build the site but do NOT publish it -- that is the point of
# the `if:` on the deploy step. A PR that breaks a roxygen link or an example
# fails here before it can reach the published site.

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only one deploy at a time; a second push while the first is publishing
    # would otherwise race on the gh-pages branch.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: a

    steps:
      - uses: actions/checkout@v4

      # Same fallback as in R-CMD-check.yaml, and bounded the same way: sf and
      # spatstat.geom link against GDAL/GEOS/PROJ/udunits, and this exists only
      # so a source build fails legibly rather than with "libgdal not found".
      # It cannot block or fail the job.
      - name: Install system dependencies
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -x
          for attempt in 1 2 3; do
            sudo -E apt-get update -y -o Acquire::Retries=3 && break
            echo "apt-get update failed (attempt $attempt), retrying..."
            sleep 5
          done
          sudo -E apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libsqlite3-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          # Replace the branch with one commit per deploy rather than keeping
          # every past build of the site.
          single-commit: true
